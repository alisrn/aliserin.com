<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<meta name="description" content="MeArcher — telefon için birinci şahıs okçuluk oyunu. A first-person archery game for phones.">
<link rel="icon" href="/favicon.png">
<title>MeArcher</title>
<style>
  :root { --bg: #fbfaf7; --fg: #1d1d1b; --muted: #5d5d58; --rule: #dedbd2; --link: #1f5f8b; --accent: #f1eee6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141413; --fg: #ecebe6; --muted: #a8a69e; --rule: #34332f; --link: #8cc3ea; --accent: #1f1e1c; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; background: var(--bg); color: var(--fg);
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  main {
    margin: auto; max-width: 30rem; text-align: center;
    padding: max(2rem, env(safe-area-inset-top)) max(1.25rem, env(safe-area-inset-right))
             max(2rem, env(safe-area-inset-bottom)) max(1.25rem, env(safe-area-inset-left));
  }
  img { width: 120px; height: 120px; border-radius: 27px; display: block; margin: 0 auto 1.25rem;
        box-shadow: 0 6px 24px rgba(0,0,0,.18); }
  h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 .75rem; letter-spacing: -.01em; }
  p { margin: 0 0 .5rem; }
  .en { color: var(--muted); }
  nav { display: flex; gap: .5rem; flex-wrap: wrap; justify-content: center; margin: 1.75rem 0 2.5rem; }
  nav a {
    display: inline-block; padding: .45rem 1rem; border: 1px solid var(--rule); border-radius: 999px;
    background: var(--accent); color: var(--link); text-decoration: none; font-weight: 600;
  }
  footer { color: var(--muted); font-size: .9rem; }
  footer a { color: var(--link); }
</style>
</head>
<body>
<main>
  <img src="/mearcher/icon.png" alt="" width="120" height="120">
  <h1>MeArcher</h1>
  <p lang="tr">Telefon için birinci şahıs okçuluk oyunu: gerçek yaylar, gerçek balistik. Yakında App Store'da.</p>
  <p lang="en" class="en">A first-person archery game for phones: real bows, real ballistics. Coming soon to the App Store.</p>
  <nav>
    <a href="/mearcher/privacy/#tr" hreflang="tr" lang="tr">Gizlilik Politikası</a>
    <a href="/mearcher/privacy/#en" hreflang="en" lang="en">Privacy Policy</a>
  </nav>
  <footer>Ali Serin · <a href="mailto:support@aliserin.com">support@aliserin.com</a></footer>
</main>
</body>
</html>
